name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install pre-commit flake8 pyright
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Verify Flake8 compliance
        run: |
          flake8

      - name: Verify Pyright type checking (gentle strict)
        run: |
          pyright src

  test-and-coverage:
    name: Test Suite & 95% Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore raw dataset for test suite
        run: |
          git checkout 261b233 -- data/raw/dataset.csv

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Execute pytest with strict 95% coverage requirement
        run: |
          pytest --cov=src --cov=tests --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Upload test coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker Container Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore raw dataset for Docker build
        run: |
          git checkout 261b233 -- data/raw/dataset.csv

      - name: Validate Docker Compose specification
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: coffee-quality-api:latest
          load: true

      - name: Verify container execution and health endpoint
        run: |
          docker run -d --name test-api -p 8000:8000 coffee-quality-api:latest
          sleep 5
          docker logs test-api
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          docker stop test-api
          docker rm -f test-api
